<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Typography</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- CSS -->

</head>
<body>
    
    <div class="container-fluid mt-5 p-5 bg-primary text-center text-warning">
        <h1>Welcome to Quarter 2</h1>
    </div>

    <div class="row mt-5">
        <div class="col-5 text-success bg-warning p-3 text-center">Column 1</div>
        <div class="col-5 text-warning bg-success p-3 text-center">Column 2</div>
    </div>

    <div class="row mt-5">
        <div class="col-3 text-center bg-danger text-info p-3">Column 1</div>
        <div class="col-3 text-center bg-info text-danger p-3">Column 2</div>
        <div class="col-3 text-center bg-danger text-info p-3">Column 3</div>
    </div>

    <div class="row mt-5">
        <div class="col-3 text-center bg-success text-muted p-3">Column 1</div>
        <div class="col-8 text-center bg-primary text-sucess p-3">Column 2</div>
    </div>

    <div class="row mt-5">
        <div class="col-3 text-center bg-warning text-danger p-3">Column 1</div>
        <div class="col-3 text-center bg-success text-info p-3">Column 2</div>
        <div class="col-3 text-center bg-info text-muted p-3">Column 3</div>
    </div>

</body>
</html>
